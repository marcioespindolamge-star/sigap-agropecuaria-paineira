{% extends "base.html" %}{% block content %}<h1>Campos</h1><section><form autocomplete="off" method="post" class="grid"><label>Nome<input name="nome" required></label><label>Área ha<input type="number" step="0.01" name="area_ha"></label><label>Pastagem<input name="pastagem"></label><label>Capacidade<input type="number" step="0.1" name="capacidade"></label><label>Situação<select name="situacao"><option>Em uso</option><option>Disponível</option><option>Descanso</option></select></label><label class="full">Observações<textarea name="observacoes"></textarea></label><button class="primary form-save-btn">SALVAR CAMPO</button></form></section>
<section><div class="tablewrap"><table><tr><th>Campo</th><th>Área ha</th><th>Pastagem</th><th>Capacidade</th><th>Ocupação</th><th>Situação</th></tr>{% for r in rows %}<tr><td>{{r['nome']}}</td><td>{{r['area_ha'] or ''}}</td><td>{{r['pastagem']}}</td><td>{{r['capacidade'] or ''}}</td><td>{{r['ocupacao']}}</td><td>{{r['situacao']}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
