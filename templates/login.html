<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acesso — Agropecuária Paineira</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#f6faf4 0%,#eaf3e8 100%);
      color:#183322;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }
    .login-card{
      width:min(430px,94vw);
      background:#fff;
      border:1px solid #d8e5d7;
      border-radius:20px;
      box-shadow:0 18px 45px rgba(28,73,42,.15);
      padding:30px 34px 32px;
      text-align:center;
    }
    .logo{
      width:138px;height:138px;object-fit:contain;
      display:block;margin:0 auto 10px;
    }
    h1{
      margin:0;
      color:#075a2a;
      font-size:26px;
      letter-spacing:.4px;
    }
    .subtitle{
      margin:7px 0 23px;
      font-weight:800;
      color:#ba9200;
      font-size:14px;
      letter-spacing:.8px;
    }
    .line{height:1px;background:#e3ece1;margin:0 0 22px}
    label{
      display:block;text-align:left;font-size:13px;font-weight:800;
      color:#365340;margin-bottom:7px;
    }
    .password-wrap{position:relative}
    input{
      width:100%;height:49px;border:1px solid #bfcfc0;border-radius:10px;
      padding:0 48px 0 14px;font-size:17px;outline:none;background:#fbfdfb;
    }
    input:focus{border-color:#13723b;box-shadow:0 0 0 3px rgba(19,114,59,.10)}
    .eye{
      position:absolute;right:8px;top:7px;width:36px;height:35px;border:0;
      background:transparent;cursor:pointer;font-size:19px;color:#48614f;
    }
    .error{
      margin:12px 0 0;padding:9px 11px;border-radius:8px;
      background:#fff1f1;color:#a91f25;font-size:13px;font-weight:700;
    }
    .enter{
      width:100%;height:50px;margin-top:18px;border:0;border-radius:10px;
      background:#075f2d;color:#fff;font-size:15px;font-weight:900;
      letter-spacing:.6px;cursor:pointer;
      box-shadow:0 5px 12px rgba(7,95,45,.18);
    }
    .enter:hover{background:#064d25}
    .hint{margin-top:17px;font-size:12px;color:#6c7d70}
  </style>
</head>
<body>
  <main class="login-card">
    <img class="logo" src="{{ LOGO_DATA_URI }}" alt="Logo Agropecuária Paineira">
    <h1>AGROPECUÁRIA PAINEIRA</h1>
    <div class="subtitle"><strong>SIGAP</strong><br><span style="font-size:11px;letter-spacing:.4px">SISTEMA INTEGRADO DE GESTÃO AGROPECUÁRIA PAINEIRA</span></div>
    <div class="line"></div>

    <form method="post">
      <label for="senha">SENHA DE ACESSO</label>
      <div class="password-wrap">
        <input id="senha" name="senha" type="password" autocomplete="current-password" autofocus required placeholder="Digite sua senha">
        <button class="eye" type="button" onclick="mostrarSenha()" title="Mostrar/ocultar senha">◉</button>
      </div>
      {% if erro %}<div class="error">{{ erro }}</div>{% endif %}
      <button class="enter" type="submit">ENTRAR NO SISTEMA</button>
    </form>

    <div class="hint">Acesso ao sistema local da Agropecuária Paineira</div>
  </main>

<script>
function mostrarSenha(){
  const c=document.getElementById('senha');
  c.type=(c.type==='password')?'text':'password';
  c.focus();
}
</script>
</body>
</html>
